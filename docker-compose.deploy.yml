version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: family_app
    ports:
      - "5432:5432"
    volumes:
      - family_app_pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/family_app?schema=public
      JWT_SECRET: change-me-to-a-strong-secret-32-plus-chars
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      SERVER_BASE_URL: http://localhost:3000
      SENTRY_DSN: ""
    depends_on:
      - postgres
    ports:
      - "3000:3000"

volumes:
  family_app_pg_data:
